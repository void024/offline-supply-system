# One server and one database - Docker Compose, no orchestrator (Prompt 2 decision).
# NOTE: written but NOT executed in the authoring sandbox (no Docker daemon there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env - never commit it}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/supply
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    ports:
      - "8080:8080"

volumes:
  db-data:
